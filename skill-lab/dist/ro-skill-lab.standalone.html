<style>
  :root{
    --bg:#12161d; --surface:#1a2029; --surface-2:#222a36; --border:#2b3341; --fg:#e7eaf0; --fg-dim:#8d96a8;
    --accent:#d1a44c; --accent-ink:#241c0c; --accent-2:#4f9d92; --danger:#d9695c; --success:#6aab74; --info:#6f9be0; --violet:#a58be0;
    --hp:#d9695c; --sp:#5b8fd6; --font-display:'Chakra Petch','Noto Sans Thai',sans-serif; --font-body:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
    --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; color-scheme:dark;
  }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
    --bg:#eef0f4; --surface:#fff; --surface-2:#f4f5f9; --border:#d7dbe3; --fg:#1b222c; --fg-dim:#636d80; --accent:#a97e2e; --accent-ink:#fff7e6;
    --accent-2:#2f786d; --danger:#b93f31; --success:#2f7a3d; --info:#2f5fa8; --violet:#6b4fb8; --hp:#c0483a; --sp:#2f63b8; color-scheme:light; } }
  :root[data-theme="light"]{
    --bg:#eef0f4; --surface:#fff; --surface-2:#f4f5f9; --border:#d7dbe3; --fg:#1b222c; --fg-dim:#636d80; --accent:#a97e2e; --accent-ink:#fff7e6;
    --accent-2:#2f786d; --danger:#b93f31; --success:#2f7a3d; --info:#2f5fa8; --violet:#6b4fb8; --hp:#c0483a; --sp:#2f63b8; color-scheme:light; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:14px; line-height:1.55;
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:0 40px; }
  .wrap{ max-width:1320px; margin:0 auto; }
  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; font-weight:600; text-wrap:balance; }
  h3{ font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-dim); }
  h4{ font-size:14px; }
  .muted{ color:var(--fg-dim); } .mono{ font-family:var(--font-mono); font-size:12.5px; } .small{ font-size:12.5px; } .tiny{ font-size:11.5px; }
  .grow{ flex:1 1 0; min-width:0; } .right{ margin-left:auto; } .nowrap{ white-space:nowrap; }
  .row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .col{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .gap-lg{ gap:16px; } .sp-between{ justify-content:space-between; }

  /* header + tabs */
  .top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; padding:10px 0; }
  .brand{ font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.02em; }
  .brand b{ color:var(--accent); } .brand .sub{ font-family:var(--font-body); font-weight:400; font-size:12.5px; color:var(--fg-dim); margin-left:8px; }
  .tabs{ display:flex; gap:4px; flex-wrap:wrap; }
  .tabs a{ font-family:var(--font-display); font-size:13px; font-weight:600; color:var(--fg-dim); text-decoration:none; padding:6px 14px;
    border-radius:6px; border:1px solid transparent; }
  .tabs a:hover{ color:var(--fg); background:var(--surface); }
  .tabs a.on{ color:var(--accent-ink); background:var(--accent); }
  body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:30; }
  main{ padding-top:16px; }

  /* panels, forms, buttons */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; min-width:0; }
  .panel > h3{ margin-bottom:10px; }
  .panel.flat{ background:var(--surface-2); }
  .cols{ display:grid; gap:14px; } .cols.c2{ grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); }
  .layout-sim{ display:grid; gap:14px; grid-template-columns:minmax(240px,280px) minmax(0,1fr) minmax(320px,430px); align-items:start; }
  .layout-two{ display:grid; gap:14px; grid-template-columns:minmax(0,1fr) minmax(300px,380px); align-items:start; }
  .layout-ed{ display:grid; gap:14px; grid-template-columns:minmax(220px,280px) minmax(0,1fr); align-items:start; }
  @media (max-width:1100px){ .layout-sim{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } .layout-sim > :nth-child(2){ order:-1; grid-column:1/-1; } }
  @media (max-width:820px){ .layout-sim,.layout-two,.layout-ed{ grid-template-columns:minmax(0,1fr); } }
  label.f{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--fg-dim); min-width:0; }
  label.f > .hint{ font-size:11.5px; opacity:.8; }
  input,select,textarea{ font:inherit; font-size:13px; color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:5px 8px; min-width:0; max-width:100%; }
  input[type=number]{ width:84px; } input[type=checkbox]{ width:auto; accent-color:var(--accent); }
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ width:100%; font-family:var(--font-mono); font-size:12px; resize:vertical; }
  .btn{ font:inherit; font-family:var(--font-display); font-weight:600; font-size:12.5px; color:var(--fg); background:var(--surface-2); border:1px solid var(--border);
    border-radius:6px; padding:5px 12px; cursor:pointer; min-height:30px; }
  .btn:hover:not(:disabled){ border-color:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.danger{ color:var(--danger); border-color:color-mix(in srgb,var(--danger) 50%,var(--border)); }
  .btn.danger.armed{ background:var(--danger); color:#fff; }
  .btn.sm{ padding:2px 8px; min-height:24px; font-size:12px; }
  .btn.on{ border-color:var(--accent); color:var(--accent); }
  .chip{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; padding:1px 8px; border-radius:99px; border:1px solid var(--border); background:var(--surface-2); white-space:nowrap; }
  .t-passive{ color:var(--accent-2); border-color:var(--accent-2); } .t-active{ color:var(--danger); border-color:var(--danger); }
  .t-buff{ color:var(--info); border-color:var(--info); } .t-toggle{ color:var(--violet); border-color:var(--violet); } .t-trigger{ color:var(--accent); border-color:var(--accent); }
  .ok{ color:var(--success); } .bad{ color:var(--danger); } .warn{ color:var(--accent); }
  table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .tbl th{ text-align:left; font-weight:600; color:var(--fg-dim); padding:4px 6px; border-bottom:1px solid var(--border); font-family:var(--font-display); font-size:12px; }
  .tbl td{ padding:4px 6px; border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent); vertical-align:top; }
  .tbl td.n,.tbl th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tbl td:first-child{ min-width:84px; }
  .scroll-x{ overflow-x:auto; max-width:100%; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:12.5px; } .kv dt{ color:var(--fg-dim); } .kv dd{ margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  .bar{ position:relative; height:14px; background:var(--bg); border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .bar > i{ position:absolute; inset:0 auto 0 0; display:block; width:0; background:var(--hp); transition:width .12s linear; }
  .bar.sp > i{ background:var(--sp); } .bar.mon > i{ background:var(--accent-2); }
  .bar > span{ position:absolute; inset:0; font-size:10.5px; line-height:12px; text-align:center; color:#fff; text-shadow:0 0 3px #000; }

  /* stage */
  .stage{ display:grid; grid-template-columns:1fr 1fr; gap:12px; position:relative; }
  .actor{ position:relative; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px; min-height:150px; overflow:hidden; display:flex; flex-direction:column; gap:6px; }
  .actor .nm{ font-family:var(--font-display); font-weight:600; } .actor.dead{ opacity:.55; filter:grayscale(.7); }
  .statuses{ display:flex; flex-wrap:wrap; gap:4px; min-height:22px; }
  .float{ position:absolute; font-family:var(--font-display); font-weight:700; font-size:18px; pointer-events:none; animation:floatUp 1.1s ease-out forwards; text-shadow:0 1px 2px #000a; }
  .float.crit{ font-size:26px; color:var(--accent); } .float.dmg{ color:#fff; } .float.taken{ color:var(--danger); } .float.heal{ color:var(--success); } .float.miss{ color:var(--fg-dim); font-size:14px; }
  @keyframes floatUp{ from{ transform:translateY(0); opacity:1; } to{ transform:translateY(-54px); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .float{ animation-duration:.01s; } .bar > i{ transition:none; } }
  .skillbar{ display:flex; flex-wrap:wrap; gap:8px; }
  .sk{ position:relative; width:104px; min-height:62px; padding:6px 7px; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; color:var(--fg); cursor:pointer; overflow:hidden; font:inherit; }
  .sk b{ display:block; font-size:12px; line-height:1.25; font-family:var(--font-display); } .sk small{ color:var(--fg-dim); font-size:11px; }
  .sk .cdov{ position:absolute; inset:0; background:color-mix(in srgb,var(--fg) 22%,transparent); border-top:2px solid var(--accent); transform-origin:bottom; transform:scaleY(0); pointer-events:none; }
  .sk.off{ opacity:.55; } .sk.active{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; } .sk.queued{ border-color:var(--info); }
  .log{ height:170px; overflow:auto; font-family:var(--font-mono); font-size:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 8px; }
  .log div{ white-space:pre-wrap; } .log .k-dmg{ color:var(--fg); } .log .k-cast{ color:var(--accent); } .log .k-taken,.log .k-death{ color:var(--danger); } .log .k-heal{ color:var(--success); } .log .k-buff,.log .k-off{ color:var(--info); } .log .k-miss,.log .k-dodge{ color:var(--fg-dim); }

  /* tree */
  .treebox{ background:var(--bg); border:1px solid var(--border); border-radius:10px; overflow:auto; max-height:72vh; }
  .treebox svg{ display:block; }
  .edge{ stroke:var(--border); stroke-width:2; fill:none; } .edge.ok{ stroke:var(--accent-2); } .edge.hl{ stroke:var(--accent); stroke-width:3; }
  .node{ cursor:pointer; } .node rect{ fill:var(--surface); stroke:var(--border); stroke-width:1.5; }
  .node.avail rect{ stroke:var(--accent-2); } .node.learned rect{ fill:color-mix(in srgb,var(--accent-2) 22%,var(--surface)); stroke:var(--accent-2); }
  .node.maxed rect{ fill:color-mix(in srgb,var(--accent) 24%,var(--surface)); stroke:var(--accent); } .node.sel rect{ stroke:var(--fg); stroke-width:2.5; }
  .node.locked{ opacity:.55; } .node.dim{ opacity:.25; }
  .node text{ fill:var(--fg); font-family:var(--font-body); font-size:11.5px; pointer-events:none; } .node text.lv{ fill:var(--accent); font-family:var(--font-display); font-weight:700; font-size:12px; }
  .node .ty{ stroke:none; }
  .colhead{ fill:var(--fg-dim); font-family:var(--font-display); font-size:12px; font-weight:600; } .rowhead{ fill:var(--fg-dim); font-size:11px; }
  .issue{ display:flex; gap:8px; padding:4px 0; border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent); font-size:12.5px; } .issue .lvl{ flex:none; width:54px; font-family:var(--font-display); font-weight:600; }
  .list{ display:flex; flex-direction:column; gap:2px; max-height:68vh; overflow:auto; }
  .li{ display:flex; gap:6px; align-items:center; padding:4px 8px; border-radius:6px; cursor:pointer; border:1px solid transparent; font-size:13px; text-align:left; background:none; color:var(--fg); font-family:inherit; }
  .li:hover{ background:var(--surface-2); } .li.on{ border-color:var(--accent); background:var(--surface-2); } .li .id{ margin-left:auto; color:var(--fg-dim); font-size:11px; }
  .toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; }
  .toast.show{ opacity:1; }
  .sw{ display:inline-flex; gap:4px; align-items:center; flex-wrap:wrap; } .sw select{ width:auto; } .sw input[type=text]{ width:90px; }
  .tablerow{ display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:4px; } .tablerow input{ width:100%; padding:3px 4px; text-align:center; }
  details > summary{ cursor:pointer; font-family:var(--font-display); font-weight:600; font-size:13px; padding:4px 0; }
  hr{ border:0; border-top:1px solid var(--border); margin:10px 0; width:100%; }

  /* RO / MMORPG Equipment Paperdoll, Grid Inventory & Kafra Storage Windows */
  .ro-suite{ display:grid; grid-template-columns:minmax(275px, 315px) minmax(330px, 1fr) minmax(330px, 1fr); gap:12px; align-items:start; }
  @media (max-width:1120px){ .ro-suite{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); } .ro-suite > :first-child{ grid-column:1/-1; } }
  @media (max-width:760px){ .ro-suite{ grid-template-columns:minmax(0,1fr); } }
  .ro-win{ background:linear-gradient(180deg, #1d2430 0%, #141922 100%); border:1.5px solid #384459; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08); overflow:hidden; display:flex; flex-direction:column; }
  .ro-win-hdr{ background:linear-gradient(90deg, #283347 0%, #1d2533 100%); border-bottom:1px solid #384459; padding:7px 11px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:var(--font-display); font-weight:700; font-size:12.5px; color:#f3e5ab; letter-spacing:.03em; }
  .ro-win-hdr .ro-dots{ display:inline-flex; gap:5px; align-items:center; }
  .ro-win-hdr .ro-dots i{ width:8px; height:8px; border-radius:50%; display:inline-block; background:#4a5568; border:1px solid #718096; }
  .ro-win-hdr .ro-dots i:first-child{ background:#63b3ed; border-color:#90cdf4; }
  .ro-win-body{ padding:10px; display:flex; flex-direction:column; gap:8px; }
  .ro-paperdoll{ display:grid; grid-template-columns:64px 1fr 64px; gap:8px; align-items:center; background:radial-gradient(circle at 50% 45%, #263244 0%, #131820 85%); border:1px solid #2d3748; border-radius:8px; padding:10px; }
  .ro-pd-col{ display:flex; flex-direction:column; gap:7px; align-items:center; }
  .ro-pd-center{ display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:175px; }
  .ro-slot{ position:relative; width:52px; height:52px; border-radius:7px; background:linear-gradient(145deg, #10141b 0%, #1a212d 100%); border:1.5px solid #2e3848; box-shadow:inset 0 2px 5px rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; transition:transform .08s, border-color .12s, box-shadow .12s; }
  .ro-slot:hover{ border-color:#d1a44c; transform:translateY(-1px); }
  .ro-slot.sel{ border-color:#f6e05e !important; box-shadow:0 0 0 2px rgba(246,224,94,0.35), inset 0 2px 5px rgba(0,0,0,0.65) !important; }
  .ro-slot.drag-over{ border-color:#68d391 !important; background:#1e3a2f !important; }
  .ro-slot.empty{ opacity:0.65; }
  .ro-slot .ro-ico{ font-size:23px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.6)); pointer-events:none; }
  .ro-slot .ro-ghost-ico{ font-size:16px; opacity:0.22; pointer-events:none; }
  .ro-slot .ro-slot-lbl{ position:absolute; bottom:2px; left:2px; right:2px; font-size:9px; text-align:center; color:#8d96a8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
  .ro-slot .ro-qty{ position:absolute; bottom:2px; right:3px; background:rgba(12,16,23,0.88); color:#fff; font-family:var(--font-mono); font-size:10px; font-weight:700; padding:0 3.5px; border-radius:4px; border:1px solid #384459; line-height:1.25; pointer-events:none; }
  .ro-slot .ro-eq-tag{ position:absolute; top:2px; right:2px; background:#d1a44c; color:#1a1408; font-family:var(--font-display); font-size:9px; font-weight:800; padding:0 3.5px; border-radius:3px; line-height:1.2; pointer-events:none; }
  .ro-slot .ro-el-tag{ position:absolute; top:2px; left:2px; font-size:11px; line-height:1; filter:drop-shadow(0 1px 2px #000); pointer-events:none; }
  .ro-slot.r-common{ border-color:#4a5568; }
  .ro-slot.r-rare{ border-color:#4299e1; box-shadow:inset 0 0 8px rgba(66,153,225,0.18); }
  .ro-slot.r-epic{ border-color:#9f7aea; box-shadow:inset 0 0 10px rgba(159,122,234,0.22); }
  .ro-slot.r-legendary{ border-color:#ecc94b; box-shadow:inset 0 0 12px rgba(236,201,75,0.28); }
  .ro-tabs{ display:flex; gap:3px; flex-wrap:wrap; border-bottom:1px solid #2e3848; padding-bottom:6px; }
  .ro-tab{ font-family:var(--font-display); font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:5px; border:1px solid #2e3848; background:#151b24; color:#94a3b8; cursor:pointer; }
  .ro-tab:hover{ color:#e2e8f0; border-color:#4a5568; }
  .ro-tab.on{ background:#d1a44c; color:#1d1608; border-color:#ecc94b; }
  .ro-grid{ display:grid; grid-template-columns:repeat(6, 52px); gap:6px; justify-content:center; background:#0f131a; border:1px solid #262f3d; border-radius:8px; padding:8px; max-height:256px; overflow-y:auto; }
  .ro-footbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px; background:#121720; border:1px solid #283140; border-radius:6px; padding:5px 9px; font-size:11.5px; }
  .ro-inspect{ background:linear-gradient(180deg, #1b222e 0%, #141922 100%); border:1px solid #384459; border-radius:8px; padding:9px 12px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; }
</style>

<script>
/* ===== 00-util.js ===== */
/* ============================================================
   MODULE 00 — util : ตัวช่วยกลาง + "ค่าที่ขยายตามเลเวลได้" (Scalable value, เรียกว่า S)
   S มี 3 รูปแบบ:  ตัวเลขคงที่ | {base, step} (เส้นตรง: base + step*(Lv-1)) | {table:[...]} (ระบุทุกเลเวล)
   โมดูลอื่นเรียกใช้ผ่าน SL.util เท่านั้น
============================================================ */
(function(g){
  const SL = g.SL = g.SL || {};

  function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
  function val(S, lv){
    if(S === undefined || S === null || S === '') return 0;
    if(typeof S === 'number') return S;
    if(Array.isArray(S)) return S.length ? S[clamp(lv,1,S.length)-1] : 0;
    if(typeof S === 'object'){
      if(Array.isArray(S.table) && S.table.length) return S.table[clamp(lv,1,S.table.length)-1];
      return (Number(S.base)||0) + (Number(S.step)||0) * (Math.max(1, lv) - 1);
    }
    return Number(S) || 0;
  }
  const lin = (v) => ({ base: v, step: v });            // "ต่อเลเวล" : Lv1 = v, Lv2 = 2v ...
  function sMode(S){
    if(S === undefined || S === null || typeof S === 'number') return 'const';
    return (S && S.table) ? 'table' : 'linear';
  }
  function clone(x){ return JSON.parse(JSON.stringify(x)); }
  function fmt(n, d){

/* ============================================================
   MODULE 02 — store : ที่เก็บ "ข้อมูลสกิล" (data) และ "สถานะตัวละคร" (state) แยกกัน
   - data  = นิยามคลาส/สกิล/อาวุธ/... (แก้ในตัวแก้ไข) เก็บที่ localStorage คีย์ roSkillLabData_v1
   - state = ตัวละครที่กำลังทดสอบ (คลาส, Job Lv, สกิลที่ลง, สเตตัส, ม้อนสเตอร์, ลำดับสกิลอัตโนมัติ) คีย์ roSkillLabState_v1
   ทุกการแก้ไขผ่าน change() เพื่อ normalize + บันทึก + แจ้งผู้ฟัง (UI) — โมดูลอื่นไม่ต้องรู้จักกัน
============================================================ */
(function(g){
  const SL = g.SL = g.SL || {};
  const { clone } = SL.util;
  const LS_DATA = 'roSkillLabData_v1', LS_STATE = 'roSkillLabState_v1';

  const COLLECTIONS = ['classes','branches','skills','weapons','statDefs','presets','monsters','builds'];

  function normalizeSkill(s){
    const d = {
      id:'', class:'', name:'', desc:'', type:'passive', branch:'', tier:1, jobLvReq:1, maxLevel:1,
      requires:[], weaponReq:{ slotType:'', damageType:'', include:[], exclude:[] }, needShield:false,
      usage:{}, damage:{ kind:'', terms:[], noCrit:false, alwaysHit:false, aoe:false }, heal:null,
      effects:[], group:'', trigger:null, toggleOff:null, hooks:{}
    };
    const o = Object.assign(d, s);
    o.weaponReq = Object.assign({ slotType:'', damageType:'', include:[], exclude:[] }, s.weaponReq || {});
    o.weaponReq.include = o.weaponReq.include || []; o.weaponReq.exclude = o.weaponReq.exclude || [];
    o.damage = Object.assign({ kind:'', terms:[], noCrit:false, alwaysHit:false, aoe:false }, s.damage || {});
    o.damage.terms = (o.damage.terms || []).map(t => ({ stat: t.stat || 'atk', mult: t.mult === undefined ? 1 : t.mult }));
    o.effects = (s.effects || []).map(e => Object.assign({ stat:'atk', mode:'flat', value:0, appliesTo:'self' }, e));
    o.requires = (s.requires || []).map(r => ({ id: r.id, lv: Math.max(1, Number(r.lv) || 1) }));
    o.usage = Object.assign({}, s.usage || {});
    o.hooks = Object.assign({}, s.hooks || {});
    o.maxLevel = Math.max(1, Math.round(Number(o.maxLevel) || 1));
    o.tier = Math.max(1, Math.round(Number(o.tier) || 1));
    o.jobLvReq = Math.max(1, Math.round(Number(o.jobLvReq) || 1));
    return o;
  }

  function normalizeData(data){
    const D = SL.DEFAULT_DATA;
    const out = (data && typeof data === 'object') ? data : {};
    COLLECTIONS.forEach(k => { if(!Array.isArray(out[k])) out[k] = clone(D[k] || []); });
    out.globals = Object.assign(clone(D.globals), out.globals || {});
    out.globals.buffPercentCap = Object.assign({}, D.globals.buffPercentCap || {}, out.globals.buffPercentCap || {});
    out.formulaConfig = Object.assign(clone(D.formulaConfig || {}), out.formulaConfig || {});
    ['statusPointSystem','baseConstants','statCurve','classCoefs','weaponProfiles','shieldProfile','magicCrit'].forEach(k => {
      if(D.formulaConfig && D.formulaConfig[k]) out.formulaConfig[k] = Object.assign(clone(D.formulaConfig[k]), out.formulaConfig[k] || {});
    });
    out.modelSlots = Object.assign(clone(D.modelSlots || { classes:{}, monsters:{} }), out.modelSlots || {});
    out.modelSlots.classes = Object.assign(clone((D.modelSlots || {}).classes || {}), out.modelSlots.classes || {});
    out.modelSlots.monsters = Object.assign(clone((D.modelSlots || {}).monsters || {}), out.modelSlots.monsters || {});

    // ระบบธาตุ 13 ธาตุ (13×13 Elemental Matrix): เติมธาตุและช่องตารางที่ยังไม่มีใน localStorage เดิมให้ครบเสมอ
    const defEs = D.elementSystem || { elements:[], matrix:{}, sizeMatrix:{} };
    out.elementSystem = Object.assign(clone(defEs), out.elementSystem || {});
    if(!Array.isArray(out.elementSystem.elements) || out.elementSystem.elements.length < defEs.elements.length){
      const existingEls = Array.isArray(out.elementSystem.elements) ? out.elementSystem.elements : [];
      const mergedEls = clone(defEs.elements);
      existingEls.forEach(el => {
        const idx = mergedEls.findIndex(x => x.id === el.id);
        if(idx >= 0) mergedEls[idx] = Object.assign(mergedEls[idx], el);
        else mergedEls.push(el);
      });
      out.elementSystem.elements = mergedEls;
    }
    const mergedMat = clone(defEs.matrix || {});
    Object.keys(out.elementSystem.matrix || {}).forEach(atkK => {
      mergedMat[atkK] = Object.assign({}, mergedMat[atkK] || {}, out.elementSystem.matrix[atkK] || {});
    });
    out.elementSystem.matrix = mergedMat;
    out.elementSystem.sizeMatrix = Object.assign(clone(defEs.sizeMatrix || {}), out.elementSystem.sizeMatrix || {});

    // คลังอุปกรณ์ การ์ดธาตุ และไอเทมกดใช้: เติมไอเทมมาตรฐานให้ครบ 28+ ชิ้นเสมอ
    if(!Array.isArray(out.equipItems)) out.equipItems = [];
    const haveEq = {};
    out.equipItems.forEach((it, idx) => {
      if(it && it.id){
        const defIt = (D.equipItems || []).find(x => x.id === it.id);
        if(defIt) out.equipItems[idx] = Object.assign(clone(defIt), it);
        haveEq[it.id] = 1;
      }
    });
    (D.equipItems || []).forEach(defIt => {
      if(defIt && defIt.id && !haveEq[defIt.id]) out.equipItems.push(clone(defIt));
    });

    // เติมมอนสเตอร์ธาตุใหม่ๆ หากยังไม่มีในคลัง
    const haveMon = {};
    out.monsters.forEach(m => { if(m && m.id) haveMon[m.id] = 1; });
    (D.monsters || []).forEach(dm => { if(dm && dm.id && !haveMon[dm.id]) out.monsters.push(clone(dm)); });

    out.worldMap = Object.assign(clone(D.worldMap || { currentMapId:'map_prontera', zones:[], spawns:[], portals:[], maps:[] }), out.worldMap || {});
    if(!Array.isArray(out.worldMap.maps) || !out.worldMap.maps.length){
      out.worldMap.maps = clone((D.worldMap || {}).maps || []);
    }
    const curMapId = out.worldMap.currentMapId || 'map_prontera';
    const curMapObj = out.worldMap.maps.find(mp => mp.id === curMapId) || out.worldMap.maps[0];
    if(curMapObj){
      out.worldMap.currentMapId = curMapObj.id;
      if(!Array.isArray(out.worldMap.zones) || !out.worldMap.zones.length) out.worldMap.zones = curMapObj.zones;
      if(!Array.isArray(out.worldMap.spawns)) out.worldMap.spawns = curMapObj.spawns;
      if(!Array.isArray(out.worldMap.portals)) out.worldMap.portals = curMapObj.portals || [];
      // ซิงก์โซนและจุดเกิดของแมพปัจจุบันกลับเข้า curMapObj เสมอ
      curMapObj.zones = out.worldMap.zones;
      curMapObj.spawns = out.worldMap.spawns;
      curMapObj.portals = out.worldMap.portals;
    }

    out.monsters = out.monsters.map(m => {
      const dm = (D.monsters || []).find(x => x.id === m.id) || {};
      const w = Object.assign(clone(dm.world || { bodyType:'slime', color:'#f27ca4', scale:1, moveSpeed:80, aggroRange:180, attackRange:65, telegraph:{ name:'โจมตีหนัก', cd:8, castTime:1.3, shape:'circle', radius:95, angle:360, mult:1.8 } }), m.world || {});
      // ซิงก์ modelSlots.monsters กับ m.world ให้ตรงกันเสมอไม่ว่าจะแก้จากหน้าไหน
      const ms = out.modelSlots.monsters[m.id] || {};
      out.modelSlots.monsters[m.id] = Object.assign({
        name: m.name,
        bodyType: w.bodyType || 'slime',
        color: w.color || '#f27ca4',
        scale: w.scale || 1,
        modelUrl: '',
        spriteUrl: ''
      }, ms, {
        name: m.name,
        bodyType: w.bodyType || ms.bodyType || 'slime',
        color: w.color || ms.color || '#f27ca4',
        scale: w.scale || ms.scale || 1
      });
      return Object.assign({
        element: dm.element || 'neutral',
        size: dm.size || 'medium',
        exp: clone(dm.exp || { base: 30, job: 20 }),
        gold: clone(dm.gold || [10, 25]),
        drops: clone(dm.drops || []),
        def:40, mdef:30, flee:60, maxHp:20000, atk:80, hit:100, interval:2
      }, m, { world: w });
    });
    out.skills = out.skills.filter(s => s && s.id).map(normalizeSkill);
    out.classes = out.classes.map(c => Object.assign({ parent:'', jobLvCap:10, pointsPerJobLv:1, desc:'' }, c));
    out.version = 3;
    return out;
  }

  // เติมรายการค่าเริ่มต้นใหม่ (เช่น สกิล/สาย/บิลด์/มอนสเตอร์ที่เพิ่งเพิ่มใน v3) เข้ากับข้อมูลเดิมใน localStorage โดยไม่ทับสิ่งที่ผู้ใช้แก้ไว้
  function migrateDefaults(parsed){
    if(!parsed || typeof parsed !== 'object' || (parsed.version || 1) >= 3) return parsed;
    const D = SL.DEFAULT_DATA;
    ['branches','skills','presets','builds','monsters'].forEach(k => {
      if(!Array.isArray(parsed[k])) return;
      const have = {}; parsed[k].forEach(x => { if(x && x.id) have[x.id] = 1; });
      (D[k] || []).forEach(x => { if(x && x.id && !have[x.id]) parsed[k].push(clone(x)); });
    });
    if(Array.isArray(parsed.classes)){
      parsed.classes.forEach(c => {
        const dc = (D.classes || []).find(x => x.id === c.id);
        if(dc && (!c.desc || c.desc.indexOf('ยังไม่มีสกิล') >= 0)) c.desc = dc.desc;
      });
    }
    parsed.version = 3;
    return parsed;
  }

  /* ---------------- DATA ---------------- */
  let DATA = null;
  const dataListeners = [];
  function loadData(){
    let parsed = null;
    try{ const raw = localStorage.getItem(LS_DATA); if(raw) parsed = migrateDefaults(JSON.parse(raw)); }catch(e){}
    DATA = normalizeData(parsed || clone(SL.DEFAULT_DATA));
    saveData();
    return DATA;
  }
  function saveData(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(DATA)); }catch(e){} }
  function emitData(reason){ dataListeners.slice().forEach(fn => { try{ fn(reason); }catch(e){ console.error(e); } }); }

  const store = {
    get(){ return DATA; },
    subscribe(fn){ dataListeners.push(fn); },
    // แก้ข้อมูลผ่านฟังก์ชันเดียว แล้ว normalize + sanitize state + บันทึก + แจ้งผู้ฟัง
    change(fn, reason){
      fn(DATA);
      DATA = normalizeData(DATA);
      saveData();
      SL.state.sanitize();
      emitData(reason || 'change');
    },
    replace(newData, reason){ DATA = normalizeData(newData); saveData(); SL.state.sanitize(); emitData(reason || 'replace'); },
    reset(){ DATA = normalizeData(clone(SL.DEFAULT_DATA)); saveData(); SL.state.sanitize(); emitData('reset'); },
    resetCollection(k){ DATA[k] = clone(SL.DEFAULT_DATA[k]); DATA = normalizeData(DATA); saveData(); SL.state.sanitize(); emitData('reset-' + k); },
    exportJSON(){ return JSON.stringify(DATA, null, 2); },
    importJSON(text){
      const parsed = JSON.parse(text);
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.skills)) throw new Error('รูปแบบไม่ถูกต้อง: ต้องมีอาเรย์ skills');
      store.replace(parsed, 'import');
    },
    find(collection, id){ return (DATA[collection] || []).find(x => x.id === id); },
    // helper อ่านอย่างเดียว
    skill(id){ return DATA.skills.find(s => s.id === id); },
    klass(id){ return DATA.classes.find(c => c.id === id); },
    save: saveData,
  };

  /* ---------------- STATE (ตัวละครที่ทดสอบ) ---------------- */
  let STATE = null;
  const stateListeners = [];
  function defaultState(){
    const p = DATA.presets[0];
    const m = DATA.monsters[0] || { id:'', def:40, mdef:30, flee:60, maxHp:20000, atk:80, hit:100, interval:2 };
    const sh = p ? p.sheet : {};
    const starterInv = ['card_poring', 'card_vadon', 'card_marina', 'card_hatii', 'eq_helm_valkyrie', 'eq_armor_odin', 'eq_armor_ignis', 'eq_cape_wind', 'eq_boots_hermes', 'eq_ring_str', 'pot_red', 'pot_blue', 'pot_aspd', 'etc_jellopy', 'etc_fang'];
    const starterCounts = { card_poring: 1, card_vadon: 1, card_marina: 1, card_hatii: 1, eq_helm_valkyrie: 1, eq_armor_odin: 1, eq_armor_ignis: 1, eq_cape_wind: 1, eq_boots_hermes: 1, eq_ring_str: 1, pot_red: 5, pot_blue: 3, pot_aspd: 2, etc_jellopy: 8, etc_fang: 3 };
    const starterStorage = ['card_sandman', 'card_griffon', 'card_angeling', 'eq_greaves_titan', 'eq_cape_dragon', 'etc_oridecon', 'etc_ice_heart'];
    const starterStorageCounts = { card_sandman: 1, card_griffon: 1, card_angeling: 1, eq_greaves_titan: 1, eq_cape_dragon: 1, etc_oridecon: 4, etc_ice_heart: 2 };
    return {
      classId: DATA.classes.find(c => c.id === 'swordman') ? 'swordman' : DATA.classes[0].id,
      baseLv: 50, jobLv: 50, learned:{}, presetId: p ? p.id : '', weaponId: p ? p.weaponId : (DATA.weapons[0] || {}).id, hasShield: p ? !!p.hasShield : false,
      rawStats: { str: sh.str || 40, agi: sh.agi || 40, vit: sh.vit || 30, int: sh.int || 30, dex: sh.dex || 40, luk: sh.luk || 20 },
      autoSyncStats: true,
      equipped: { headgear: '', armor: '', garment: '', footgear: '', accessory: '', card: '' },
      inventory: starterInv,
      itemCounts: starterCounts,
      storage: starterStorage,
      storageCounts: starterStorageCounts,

      baseExp: 0,
      jobExp: 0,

      rotation: [], opts:{ auto:true, speed:1, benchSeconds:60 },

  function loadState(){
    let parsed = null;
    try{ const raw = localStorage.getItem(LS_STATE); if(raw) parsed = JSON.parse(raw); }catch(e){}
    STATE = Object.assign(defaultState(), parsed || {});
    STATE.rawStats = Object.assign({ str:40, agi:40, vit:30, int:30, dex:40, luk:20 }, STATE.rawStats || {});
    STATE.equipped = Object.assign({ headgear:'', armor:'', garment:'', footgear:'', accessory:'', card:'' }, STATE.equipped || {});
    if(!Array.isArray(STATE.inventory) || !STATE.inventory.length){
      STATE.inventory = ['card_poring', 'card_vadon', 'card_marina', 'card_hatii', 'eq_helm_valkyrie', 'eq_armor_odin', 'eq_armor_ignis', 'eq_cape_wind', 'eq_boots_hermes', 'eq_ring_str', 'pot_red', 'pot_blue', 'pot_aspd', 'etc_jellopy', 'etc_fang'];
    }
    STATE.itemCounts = (STATE.itemCounts && typeof STATE.itemCounts === 'object') ? STATE.itemCounts : {};
    // ซิงก์รายการใน inventory ให้มีจำนวนใน itemCounts เสมอ และเติมยา/วัตถุดิบเริ่มต้นให้หากยังไม่มี
    ['pot_red', 'pot_blue', 'pot_aspd', 'eq_armor_ignis', 'eq_cape_wind', 'eq_boots_hermes', 'eq_ring_str', 'etc_jellopy', 'etc_fang'].forEach(stId => {
      if(STATE.inventory.indexOf(stId) < 0 && STATE.itemCounts[stId] === undefined){

    }
    STATE.storageCounts = (STATE.storageCounts && typeof STATE.storageCounts === 'object') ? STATE.storageCounts : {};
    STATE.storage.forEach(id => {
      if(id && (!STATE.storageCounts[id] || STATE.storageCounts[id] < 1)){
        STATE.storageCounts[id] = id === 'etc_oridecon' ? 4 : (id === 'etc_ice_heart' ? 2 : 1);

    STATE.baseExp = Math.max(0, Number(STATE.baseExp) || 0);
    STATE.jobExp = Math.max(0, Number(STATE.jobExp) || 0);
    STATE.baseLv = Math.max(1, Math.min(99, Math.round(Number(STATE.baseLv) || 50)));

  }
  function saveState(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(STATE)); }catch(e){} }
  // ล้างค่าที่อ้างถึงสิ่งที่ไม่มีแล้ว (สกิลถูกลบ คลาสหาย เลเวลเกิน max) — ทำให้แก้ข้อมูลได้โดยไม่ทำให้ตัวละครพัง
  function sanitize(silent){
    if(!STATE) return;
    if(!store.klass(STATE.classId)) STATE.classId = DATA.classes[0].id;
    const cls = store.klass(STATE.classId);
    STATE.jobLv = SL.util.clamp(Math.round(Number(STATE.jobLv) || 1), 1, cls.jobLvCap);
    if(!store.find('weapons', STATE.weaponId)) STATE.weaponId = (DATA.weapons[0] || {}).id;
    STATE.equipped = Object.assign({ headgear:'', armor:'', garment:'', footgear:'', accessory:'', card:'' }, STATE.equipped || {});
    const learned = {};
    Object.keys(STATE.learned || {}).forEach(id => {
      const s = store.skill(id); const lv = Math.round(Number(STATE.learned[id]) || 0);
      if(s && lv > 0) learned[id] = Math.min(lv, s.maxLevel);
    });
    STATE.learned = learned;
    STATE.rotation = (STATE.rotation || []).filter(r => r && store.skill(r.id));
    // ซิงก์มอนสเตอร์ในหน้าจำลองการต่อสู้ (#sim) ทันทีเมื่อข้อมูลมอนสเตอร์ในคลังถูกแก้ไขจากหน้าอื่น
    if(STATE.monsterPresetId){
      const mDef = store.find('monsters', STATE.monsterPresetId);
      if(mDef){
        const keepCounter = STATE.monster && STATE.monster.counter;
        STATE.monster = Object.assign({}, clone(mDef), { counter: !!keepCounter });
      } else if(DATA.monsters[0]){
        STATE.monsterPresetId = DATA.monsters[0].id;
        STATE.monster = Object.assign({}, clone(DATA.monsters[0]), { counter: false });
      }
    }
    // ซิงก์ค่าสเตตัสปลายทาง (Derived Sheet) อัตโนมัติเมื่อเปิดโหมด Auto-Sync
    if(STATE.autoSyncStats && SL.calc && SL.calc.computeDerivedFromRaw){
      try {
        const dRes = SL.calc.computeDerivedFromRaw(STATE);
        if(dRes && dRes.sheet) STATE.sheet = Object.assign({}, STATE.sheet, dRes.sheet);
      } catch(e){}
    }
    if(!silent){ saveState(); stateListeners.slice().forEach(fn => { try{ fn(); }catch(e){ console.error(e); } }); }
  }
  const state = {
    get(){ return STATE; },
    subscribe(fn){ stateListeners.push(fn); },
    change(fn){ fn(STATE); sanitize(); },
    sanitize, save: saveState, saveSilent: saveState,
    reset(){ STATE = defaultState(); sanitize(); },
    getQty(itemId){
      if(!STATE || !itemId) return 0;
      if(STATE.itemCounts && STATE.itemCounts[itemId] !== undefined) return Math.max(0, Number(STATE.itemCounts[itemId]) || 0);
      return Array.isArray(STATE.inventory) && STATE.inventory.indexOf(itemId) >= 0 ? 1 : 0;
    },
    addItem(itemId, qty){
      if(!STATE || !itemId) return 0;
      const n = Math.max(1, Math.round(Number(qty) || 1));
      const prev = state.getQty(itemId);
      if(!Array.isArray(STATE.inventory)) STATE.inventory = [];
      if(!STATE.itemCounts || typeof STATE.itemCounts !== 'object') STATE.itemCounts = {};
      if(STATE.inventory.indexOf(itemId) < 0) STATE.inventory.push(itemId);
      STATE.itemCounts[itemId] = prev + n;
      saveState();
      return STATE.itemCounts[itemId];
    },
    removeItem(itemId, qty){
      if(!STATE || !itemId) return 0;
      const n = Math.max(1, Math.round(Number(qty) || 1));
      if(!Array.isArray(STATE.inventory)) STATE.inventory = [];
      if(!STATE.itemCounts || typeof STATE.itemCounts !== 'object') STATE.itemCounts = {};
      const cur = state.getQty(itemId);
      const next = Math.max(0, cur - n);
      if(next <= 0){
        delete STATE.itemCounts[itemId];
        STATE.inventory = STATE.inventory.filter(x => x !== itemId);
        // หากถอด/ขายจนหมดชิ้นสุดท้าย ให้ถอดออกจากช่องสวมใส่ด้วย
        Object.keys(STATE.equipped || {}).forEach(slot => {
          if(STATE.equipped[slot] === itemId) STATE.equipped[slot] = '';
        });
      } else {
        STATE.itemCounts[itemId] = next;
      }
      sanitize();
      return next;
    },
    equipItem(itemId){
      const it = store.find('equipItems', itemId);
      if(!it || !it.slot || it.slot === 'consumable' || it.slot === 'etc') return false;
      state.change(s => {
        if(!s.equipped) s.equipped = { headgear:'', armor:'', garment:'', footgear:'', accessory:'', card:'' };
        s.equipped[it.slot] = s.equipped[it.slot] === itemId ? '' : itemId;
      });
      return true;
    },
    unequipSlot(slot){
      state.change(s => {
        if(s.equipped && slot in s.equipped) s.equipped[slot] = '';
      });
    },
    getStorageQty(itemId){
      if(!STATE || !itemId) return 0;
      if(STATE.storageCounts && STATE.storageCounts[itemId] !== undefined) return Math.max(0, Number(STATE.storageCounts[itemId]) || 0);
      return Array.isArray(STATE.storage) && STATE.storage.indexOf(itemId) >= 0 ? 1 : 0;
    },
    depositToStorage(itemId, qty){
      if(!STATE || !itemId) return false;
      const curInv = state.getQty(itemId);
      if(curInv <= 0) return false;
      const n = Math.min(curInv, Math.max(1, Math.round(Number(qty) || 1)));
      const prevSt = state.getStorageQty(itemId);
      if(!Array.isArray(STATE.storage)) STATE.storage = [];
      if(!STATE.storageCounts || typeof STATE.storageCounts !== 'object') STATE.storageCounts = {};
      if(STATE.storage.indexOf(itemId) < 0) STATE.storage.push(itemId);
      STATE.storageCounts[itemId] = prevSt + n;
      state.removeItem(itemId, n);
      return true;
    },
    withdrawFromStorage(itemId, qty){
      if(!STATE || !itemId) return false;
      const curSt = state.getStorageQty(itemId);
      if(curSt <= 0) return false;
      const n = Math.min(curSt, Math.max(1, Math.round(Number(qty) || 1)));
      const next = Math.max(0, curSt - n);
      if(next <= 0){
        delete STATE.storageCounts[itemId];
        STATE.storage = (STATE.storage || []).filter(x => x !== itemId);
      } else {
        STATE.storageCounts[itemId] = next;
      }
      state.addItem(itemId, n);
      sanitize();
      return true;
    },
    calcWeight(){
      if(!STATE) return { cur: 0, max: 2000 };
      const str = (STATE.rawStats && STATE.rawStats.str) || 40;
      const maxW = 2000 + str * 30;
      let curW = 0;
      const eqAll = (DATA && DATA.equipItems) || [];
      (STATE.inventory || []).forEach(id => {
        const q = state.getQty(id);
        if(q <= 0) return;
        const it = eqAll.find(x => x.id === id);
        const w = (it && it.weight) || (it && it.slot === 'card' ? 1 : (it && it.slot === 'consumable' ? 10 : 25));
        curW += w * q;
      });
      return { cur: Math.round(curW), max: Math.round(maxW) };
    },
    sortInventory(){
      if(!STATE || !Array.isArray(STATE.inventory)) return;
      const order = { headgear:1, armor:2, garment:3, footgear:4, accessory:5, card:6, consumable:7, etc:8 };
      const eqAll = (DATA && DATA.equipItems) || [];
      STATE.inventory.sort((a, b) => {
        const ia = eqAll.find(x => x.id === a) || {};
        const ib = eqAll.find(x => x.id === b) || {};
        return (order[ia.slot] || 99) - (order[ib.slot] || 99);
      });
      saveState();
    }
  };

  SL.store = store; SL.state = state; SL.loadAll = function(){ loadData(); loadState(); };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 03-rules.js ===== */
/* ============================================================
   MODULE 03 — rules : กติกาของต้นไม้สกิล (เรียนสกิล / ปลดล็อก / เงื่อนไข / งบแต้ม / ตรวจความถูกต้อง)
   ไม่แตะ DOM และไม่รู้จัก engine — อ่านแค่ data (SL.store) กับ state (SL.state)
============================================================ */
(function(g){
  const SL = g.SL = g.SL || {};
  const { val } = SL.util;
  const rules = {};

  const D = () => SL.store.get();

  // รายการคลาสจากรากถึงคลาสที่ระบุ เช่น ['novice','swordman']
  rules.chain = function(classId){
    const out = []; const seen = {};
    let cur = SL.store.klass(classId);
    while(cur && !seen[cur.id]){ seen[cur.id] = 1; out.unshift(cur.id); cur = cur.parent ? SL.store.klass(cur.parent) : null; }
    return out;
  };
  rules.visibleSkills = function(classId){
    const ch = rules.chain(classId);
    return D().skills.filter(s => ch.indexOf(s.class) >= 0);
  };
  // งบแต้มแยกตามคลาสในสาย: คลาสก่อนหน้าถือว่าจบ Job Lv สูงสุดแล้ว คลาสปัจจุบันใช้ jobLv ของ state
  rules.pointInfo = function(state){
    const ch = rules.chain(state.classId);
    return ch.map((cid, i) => {
      const c = SL.store.klass(cid); const cur = i === ch.length - 1;
      const total = Math.max(0, ((cur ? state.jobLv : c.jobLvCap) - 1) * (c.pointsPerJobLv || 1));
      let spent = 0; D().skills.forEach(s => { if(s.class === cid) spent += state.learned[s.id] || 0; });
      return { classId: cid, name: c.name, total, spent, left: total - spent, current: cur };
    });
  };
  rules.jobLvFor = function(classId, state){
    return classId === state.classId ? state.jobLv : (SL.store.klass(classId) || { jobLvCap: 1 }).jobLvCap;
  };
  rules.dependents = function(id){ return D().skills.filter(s => s.requires.some(r => r.id === id)); };

  rules.reqStatus = function(skill, state){
    return skill.requires.map(r => {
      const t = SL.store.skill(r.id);
      return { id: r.id, lv: r.lv, name: t ? t.name : r.id + ' (ไม่พบ)', have: state.learned[r.id] || 0, ok: (state.learned[r.id] || 0) >= r.lv };
    });
  };
  rules.canLearn = function(skill, state){
    const lv = state.learned[skill.id] || 0;
    if(lv >= skill.maxLevel) return { ok:false, reason:'เลเวลเต็มแล้ว' };
    if(rules.chain(state.classId).indexOf(skill.class) < 0) return { ok:false, reason:'ไม่ใช่สกิลของสายนี้' };
    const need = skill.jobLvReq, have = rules.jobLvFor(skill.class, state);
    if(have < need) return { ok:false, reason:'ต้องการ Job Lv.' + need };
    const bad = rules.reqStatus(skill, state).find(r => !r.ok);
    if(bad) return { ok:false, reason:'ต้องมี ' + bad.name + ' Lv.' + bad.lv };
    const pool = rules.pointInfo(state).find(p => p.classId === skill.class);
    if(!pool || pool.left <= 0) return { ok:false, reason:'แต้มของ ' + (pool ? pool.name : skill.class) + ' หมด' };
    return { ok:true, reason:'' };
  };
  rules.canUnlearn = function(skill, state){
    const lv = state.learned[skill.id] || 0;
    if(lv <= 0) return { ok:false, reason:'ยังไม่ได้เรียน' };
    const blocker = rules.dependents(skill.id).find(d => (state.learned[d.id] || 0) > 0 &&
      d.requires.some(r => r.id === skill.id && r.lv > lv - 1));
    if(blocker) return { ok:false, reason:'ถูกใช้เป็นเงื่อนไขของ ' + blocker.name };
    return { ok:true, reason:'' };
  };
  rules.learn = function(id){
    const s = SL.store.skill(id); if(!s) return;
    SL.state.change(st => { if(rules.canLearn(s, st).ok) st.learned[id] = (st.learned[id] || 0) + 1; });
  };
  rules.unlearn = function(id){
    const s = SL.store.skill(id); if(!s) return;
    SL.state.change(st => { if(rules.canUnlearn(s, st).ok){ st.learned[id] -= 1; if(st.learned[id] <= 0) delete st.learned[id]; } });
  };
  // โหลดบิลด์สำเร็จรูป (ตั้งคลาส, Job Lv, สกิล, พรีเซ็ตสเตตัส)
  rules.applyBuild = function(buildId){
    const b = SL.store.find('builds', buildId); if(!b) return;
    SL.state.change(st => {
      st.classId = b.classId; st.jobLv = b.jobLv; st.learned = SL.util.clone(b.learned || {});
      const p = SL.store.find('presets', b.presetId);
      if(p){
        st.presetId = p.id; st.weaponId = p.weaponId; st.hasShield = !!p.hasShield; st.sheet = SL.util.clone(p.sheet);
        st.baseLv = b.classId === 'novice' ? 10 : 50;
        st.rawStats = { str: p.sheet.str || 1, agi: p.sheet.agi || 1, vit: p.sheet.vit || 1, int: p.sheet.int || 1, dex: p.sheet.dex || 1, luk: p.sheet.luk || 1 };
      }
      st.rotation = [];
    });
    SL.state.change(st => { st.rotation = rules.defaultRotation(st); });
  };

  // เงื่อนไขอาวุธ/โล่ ของสกิล (ใช้ทั้งตอนคิดผล passive และตอนร่ายสกิล)
  rules.weaponOk = function(skill, weapon, hasShield){
    const r = skill.weaponReq || {};
    if(skill.needShield && !(hasShield && weapon && weapon.slotType === '1H')) return false;
    if(!weapon) return !(r.slotType || r.damageType || (r.include && r.include.length));
    if(r.slotType && weapon.slotType !== r.slotType) return false;
    if(r.damageType && weapon.damageType !== r.damageType) return false;
    if(r.include && r.include.length && r.include.indexOf(weapon.weaponClass) < 0) return false;
    if(r.exclude && r.exclude.length && r.exclude.indexOf(weapon.weaponClass) >= 0) return false;
    return true;
  };

  rules.isCastable = s => s.type === 'active' || s.type === 'buff' || s.type === 'toggle';

  // สร้างลำดับสกิลอัตโนมัติ: บัฟ/toggle → ดีบัฟ → สกิลดาเมจ (แรงสุดก่อน) → ฮีล
  rules.defaultRotation = function(state){
    const items = [];
    rules.visibleSkills(state.classId).forEach(s => {
      const lv = state.learned[s.id] || 0;
      if(lv <= 0 || !rules.isCastable(s)) return;
      let rank = 2, score = 0;
      const dmg = s.damage && s.damage.kind;
      if(s.type === 'buff' || s.type === 'toggle') rank = 0;
      else if(!dmg && s.heal) rank = 3;
      else if(!dmg) rank = 1;
      if(dmg) score = (s.damage.terms || []).reduce((a, t) => a + Math.abs(val(t.mult, lv)), 0);
      items.push({ s, rank, score });
    });
    items.sort((a, b) => a.rank - b.rank || b.score - a.score);
    return items.map(it => ({ id: it.s.id, minSpPct: 0, minHpPct: 0, maxHpPct: it.rank === 3 ? 0.7 : 1, skipIfActive: true }));
  };

  /* ---------------- ตรวจความถูกต้องของข้อมูลทั้งชุด ---------------- */
  rules.validate = function(data){
    const issues = [];
    const add = (level, msg, ref) => issues.push({ level, msg, ref: ref || '' });
    const ids = {}; const stat = {}; data.statDefs.forEach(s => stat[s.id] = 1);
    const cls = {}; data.classes.forEach(c => cls[c.id] = c);
    data.classes.forEach(c => {
      if(c.parent && !cls[c.parent]) add('error', 'คลาส "' + c.name + '" อ้าง parent ที่ไม่มี: ' + c.parent, c.id);
    });
    data.classes.forEach(c => {            // วงวน parent
      const seen = {}; let cur = c;
      while(cur && cur.parent){ if(seen[cur.id]){ add('error', 'ลำดับ parent ของคลาส "' + c.name + '" วนเป็นวงกลม', c.id); break; } seen[cur.id] = 1; cur = cls[cur.parent]; }
    });
    data.skills.forEach(s => {
      if(ids[s.id]) add('error', 'id ซ้ำ: ' + s.id, s.id); ids[s.id] = s;
    });
    data.skills.forEach(s => {
      const nm = s.name + ' (' + s.id + ')';
      if(!cls[s.class]) add('error', nm + ': ไม่พบคลาส "' + s.class + '"', s.id);
      else {
        const br = data.branches.find(b => b.id === s.branch);
        if(s.branch && !br) add('warn', nm + ': ไม่พบสาย "' + s.branch + '"', s.id);
        else if(br && br.class !== s.class) add('warn', nm + ': สายนี้เป็นของคลาส ' + br.class, s.id);
        if(s.jobLvReq > cls[s.class].jobLvCap) add('warn', nm + ': ต้องการ Job Lv.' + s.jobLvReq + ' แต่คลาสสูงสุด ' + cls[s.class].jobLvCap + ' (เรียนไม่ได้)', s.id);
      }
      s.requires.forEach(r => {
        const t = ids[r.id];
        if(r.id === s.id) add('error', nm + ': อ้างตัวเองเป็นเงื่อนไข', s.id);
        else if(!t) add('error', nm + ': เงื่อนไขอ้างสกิลที่ไม่มี "' + r.id + '"', s.id);
        else {
          if(r.lv > t.maxLevel) add('error', nm + ': ต้องการ ' + t.name + ' Lv.' + r.lv + ' แต่สกิลนั้นสูงสุด Lv.' + t.maxLevel, s.id);
          if(t.class === s.class && t.jobLvReq > s.jobLvReq) add('warn', nm + ': เงื่อนไข ' + t.name + ' ปลดล็อกที่ Job Lv.' + t.jobLvReq + ' หลังตัวสกิลเอง (Lv.' + s.jobLvReq + ')', s.id);
          if(cls[s.class] && cls[t.class]){
            const chain = []; let cur = cls[s.class]; const seen = {};
            while(cur && !seen[cur.id]){ seen[cur.id] = 1; chain.push(cur.id); cur = cls[cur.parent]; }
            if(chain.indexOf(t.class) < 0) add('warn', nm + ': เงื่อนไขมาจากคลาส ' + t.class + ' ซึ่งไม่ใช่คลาสในสายเดียวกัน', s.id);
          }
        }
      });
      s.effects.forEach(e => { if(!stat[e.stat]) add('error', nm + ': effect อ้างสเตตัส "' + e.stat + '" ที่ไม่มีใน statDefs', s.id); });
      (s.damage.terms || []).forEach(t => { if(!stat[t.stat]) add('error', nm + ': สูตรดาเมจอ้างสเตตัส "' + t.stat + '" ที่ไม่มี', s.id); });
      if(s.damage.kind && !(s.damage.terms || []).length) add('warn', nm + ': มีชนิดดาเมจแต่ไม่มีสูตร (terms)', s.id);
      if(s.type === 'active' && !s.damage.kind && !s.heal && !s.effects.length) add('warn', nm + ': สกิล active ที่ไม่มีดาเมจ/ฮีล/effect เลย', s.id);
      if((s.type === 'active' || s.type === 'buff') && s.effects.length && !(s.usage.duration)) add('warn', nm + ': มี effect แต่ไม่ได้ตั้ง duration (จะไม่มีผล)', s.id);
      if(s.type === 'trigger' && !s.trigger) add('error', nm + ': สกิล trigger ต้องมีเงื่อนไข trigger', s.id);
      if(s.type === 'toggle' && !s.effects.length) add('warn', nm + ': toggle ที่ไม่มี effect', s.id);
      if(s.type === 'passive' && s.effects.length === 0) add('warn', nm + ': passive ที่ไม่มี effect', s.id);
    });
    // วงวนของ prerequisite
    const color = {};
    function dfs(id, path){
      if(color[id] === 2) return; if(color[id] === 1){ add('error', 'เงื่อนไขสกิลวนเป็นวงกลม: ' + path.concat(id).join(' → '), id); return; }
      color[id] = 1; const s = ids[id];
      if(s) s.requires.forEach(r => { if(ids[r.id]) dfs(r.id, path.concat(id)); });
      color[id] = 2;
    }
    data.skills.forEach(s => dfs(s.id, []));
    // สรุปงบแต้ม
    data.classes.forEach(c => {
      const own = data.skills.filter(s => s.class === c.id);
      if(!own.length) return;
      const levels = own.reduce((a, s) => a + s.maxLevel, 0), pts = (c.jobLvCap - 1) * (c.pointsPerJobLv || 1);
      add('info', c.name + ': ' + own.length + ' สกิล รวม ' + levels + ' เลเวล เทียบแต้ม ' + pts + ' (ซื้อได้ ' + Math.round(Math.min(1, pts / levels) * 100) + '%)', c.id);
    });
    return issues;
  };

  SL.rules = rules;
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 04-stats.js ===== */
/* ============================================================
   MODULE 04 — calc : คำนวณสเตตัสสุดท้ายของผู้เล่น/มอนสเตอร์ และสูตรดาเมจ (ฟังก์ชันล้วน ไม่มี DOM ไม่มีเวลา)
   สเตตัสสุดท้าย = (ค่าจากชีต + flat จาก passive/สถานะ) × (1 + %จาก passive + %จากบัฟ(ถูกจำกัดด้วย buffPercentCap))
   ใช้ทั้งหน้าจำลอง (sim) และตารางดาเมจต่อสกิล (UI) — แก้สูตรที่นี่ที่เดียว
============================================================ */
(function(g){
  const SL = g.SL = g.SL || {};
  const { val, clamp } = SL.util;
  const calc = {};
  const G = () => SL.store.get().globals;

  /* ---------- ตัวช่วยแสดงผลสเตตัส ---------- */
  const sgn = v => (v < 0 ? '−' : '+');
  const rnd = (v, d) => Number(Math.abs(v).toFixed(d));
  calc.statDef = id => SL.store.get().statDefs.find(s => s.id === id);
  calc.statName = id => { const s = calc.statDef(id); return s ? s.name : id; };
  // แสดงผลของ effect เช่น "ATK +9" "DEF −30%"
  calc.fmtEffect = function(stat, mode, v){
    const sd = calc.statDef(stat); const name = sd ? sd.name : stat;
    if(mode === 'percent') return name + ' ' + sgn(v) + rnd(v * 100, 1) + '%';
    if(sd && sd.kind === 'frac') return name + ' ' + sgn(v) + rnd(v * 100, 1) + '%';
    if(sd && sd.kind === 'pct') return name + ' ' + sgn(v) + rnd(v, 1) + '%';
    return name + ' ' + sgn(v) + rnd(v, 2);
  };
  // แสดงค่าสเตตัสสุดท้าย
  calc.fmtStat = function(stat, v){
    const sd = calc.statDef(stat);
    if(sd && sd.kind === 'frac') return rnd(v * 100, 1) + '%';
    if(sd && sd.kind === 'pct') return rnd(v, 1) + '%';
    return String(Number(v.toFixed(Math.abs(v) < 10 ? 2 : 1)));
  };

  /* ---------- ค่าใช้สกิลที่เลเวลนั้น ---------- */
  calc.usage = function(skill, lv){
    const u = skill.usage || {};
    return {
      sp: val(u.sp, lv), hp: val(u.hp, lv), cooldown: val(u.cooldown, lv), duration: val(u.duration, lv),
      hpDrain: val(u.hpDrain, lv), spDrain: val(u.spDrain, lv),
      // ร่ายแล้วใช้เวลาแทนการตี 1 ครั้งหรือไม่ (toggle เปิด/ปิดทันที ไม่เสียจังหวะ)
      usesAction: u.usesAction === undefined ? skill.type !== 'toggle' : !!u.usesAction,
    };
  };

  /* ---------- รายการ passive ที่ได้ผล ---------- */
  calc.passives = function(state){
    const W = SL.store.find('weapons', state.weaponId);
    const out = [];
    SL.rules.visibleSkills(state.classId).forEach(s => {
      const lv = state.learned[s.id] || 0;
      if(lv > 0 && s.type === 'passive') out.push({ skill: s, lv: lv, active: SL.rules.weaponOk(s, W, state.hasShield) });
    });
    return out;
  };

  /* ---------- ผู้เล่น ----------
     statuses = [{id, lv}] สถานะที่กำลังติดตัว (buff / toggle / trigger / aftermath) */
  calc.player = function(state, statuses){
    const D = SL.store.get(), Gl = D.globals;
    const W = SL.store.find('weapons', state.weaponId) || D.weapons[0];
    const base = {}; D.statDefs.forEach(sd => { base[sd.id] = Number(state.sheet[sd.id]) || 0; });
    const flat = {}, pct = {}, bpct = {}, sources = {};
    function put(stat, mode, v, name, buff){
      if(!(stat in base)) return;
      if(mode === 'percent'){ if(buff) bpct[stat] = (bpct[stat] || 0) + v; else pct[stat] = (pct[stat] || 0) + v; }
      else flat[stat] = (flat[stat] || 0) + v;
      (sources[stat] = sources[stat] || []).push({ name: name, text: calc.fmtEffect(stat, mode, v).replace(calc.statName(stat) + ' ', ''), buff: !!buff });
    }
    calc.passives(state).forEach(p => { if(!p.active) return;
      p.skill.effects.forEach(e => { if(e.appliesTo !== 'target') put(e.stat, e.mode, val(e.value, p.lv), p.skill.name, false); }); });

    // รวมโบนัสจากอุปกรณ์สวมใส่ทั้ง 6 ช่องและการ์ดธาตุ (Equipment & RO Cards — ใช้โครงสร้าง effects เดียวกับพาสซีฟ)
    let attackElement = 'neutral';
    let defenseElement = 'neutral';
    const eq = state.equipped || {};
    const eqList = D.equipItems || [];
    ['headgear', 'armor', 'garment', 'footgear', 'accessory', 'card'].forEach(slotKey => {
      const itemId = eq[slotKey];
      if(!itemId) return;
      const item = eqList.find(x => x.id === itemId);
      if(!item) return;
      if(item.attackElement) attackElement = item.attackElement;
      if(item.defenseElement) defenseElement = item.defenseElement;
      (item.effects || []).forEach(e => {
        put(e.stat, e.mode, val(e.value, 1), item.name, false);
      });
    });

    (statuses || []).forEach(st => { const s = SL.store.skill(st.id); if(!s) return;
      s.effects.forEach(e => { if(e.appliesTo !== 'target') put(e.stat, e.mode, val(e.value, st.lv), s.name, true); }); });

    const S = {};
    Object.keys(base).forEach(k => {
      let b = bpct[k] || 0; const cap = Gl.buffPercentCap ? Gl.buffPercentCap[k] : undefined;
      if(cap !== undefined && b > cap) b = cap;
      S[k] = (base[k] + (flat[k] || 0)) * (1 + (pct[k] || 0) + b);
    });
    S.aspd = clamp(S.aspd, 0, Gl.aspdCap);
    S.physReduction = clamp(S.physReduction, 0, Gl.maxPhysReduction);
    S.blockChance = clamp(S.blockChance, 0, 1);
    S.damageTaken = Math.max(-0.9, S.damageTaken);
    S.maxHp = Math.max(1, S.maxHp); S.maxSp = Math.max(0, S.maxSp);
    ['def','mdef','flee','hit','atk','matk'].forEach(k => { S[k] = Math.max(0, S[k]); });
    // ความเร็วโจมตี แบบ RO: 100 / (200 − ASPD)
    const aps = Math.max(0.1, 100 / (200 - Math.min(S.aspd, 199)));
    return { stats: S, weapon: W, hasShield: !!state.hasShield, aps: aps, attackElement: attackElement, defenseElement: defenseElement, sources: sources };
  };

  /* ---------- มอนสเตอร์ : รองรับสถานะที่ผู้เล่นติดให้ (effect appliesTo:'target') + ธาตุ/ขนาด ---------- */
  calc.monster = function(m, statuses){
    const S = {
      def: +m.def || 0, mdef: +m.mdef || 0, flee: +m.flee || 0, hit: +m.hit || 0, atk: +m.atk || 0, maxHp: +m.maxHp || 1, damageTaken: 0,
      element: m.element || 'neutral',
      size: m.size || 'medium'
    };
    const pct = {};
    (statuses || []).forEach(st => { const s = SL.store.skill(st.id); if(!s) return;
      s.effects.forEach(e => { if(e.appliesTo !== 'target' || !(e.stat in S)) return;
        const v = val(e.value, st.lv);
        if(e.mode === 'percent') pct[e.stat] = (pct[e.stat] || 0) + v; else S[e.stat] += v; }); });
    Object.keys(pct).forEach(k => { S[k] = S[k] * (1 + pct[k]); });
    ['def','mdef','flee','hit','atk'].forEach(k => { S[k] = Math.max(0, S[k]); });
    S.damageTaken = Math.max(-0.9, S.damageTaken);
    S.interval = Math.max(0.2, +m.interval || 2);
    return S;
  };

  /* ---------- ตารางแพ้ชนะธาตุ 13 ธาตุ & ขนาดอาวุธ (RO Elemental & Size Matrix) ---------- */
  calc.elementInfo = function(elemId){
    const es = (SL.store.get() || {}).elementSystem || SL.DEFAULT_DATA.elementSystem || {};
    const list = es.elements || [];
    const found = list.find(e => e.id === (elemId || 'neutral'));
    return found || { id: elemId || 'neutral', name: elemId || 'ไร้ธาตุ', icon: '⚪', color: '#a0aec0', desc: '' };
  };

  calc.elementMult = function(atkElem, defElem){
    const es = (SL.store.get() || {}).elementSystem || SL.DEFAULT_DATA.elementSystem || {};
    const mat = es.matrix || {};
    const a = atkElem || 'neutral', d = defElem || 'neutral';
    if(mat[a] && mat[a][d] !== undefined) return Number(mat[a][d]);
    return 1.0;
  };

  // วิเคราะห์ความสัมพันธ์แพ้-ชนะทางของธาตุหนึ่งๆ ทั้งฝั่งโจมตีและฝั่งป้องกัน
  calc.elementRelations = function(elemId){
    const es = (SL.store.get() || {}).elementSystem || SL.DEFAULT_DATA.elementSystem || {};
    const list = es.elements || [];
    const id = elemId || 'neutral';
    const strongAgainst = [];      // เมื่อใช้ธาตุนี้โจมตี -> ชนะธาตุใดบ้าง (mult >= 1.25)
    const weakAttackAgainst = [];  // เมื่อใช้ธาตุนี้โจมตี -> แพ้ทาง/ติดต้านทานธาตุใดบ้าง (mult <= 0.75)
    const weakToAttackers = [];    // เมื่อมอนสเตอร์/เกราะเป็นธาตุนี้ -> แพ้ทางธาตุโจมตีใดบ้าง (mult >= 1.25)
    const resistsAttackers = [];   // เมื่อมอนสเตอร์/เกราะเป็นธาตุนี้ -> ต้านทานธาตุโจมตีใดบ้าง (mult <= 0.75)
    list.forEach(el => {
      const mAtk = calc.elementMult(id, el.id);
      if(mAtk >= 1.2) strongAgainst.push(Object.assign({}, el, { mult: mAtk }));
      else if(mAtk <= 0.8) weakAttackAgainst.push(Object.assign({}, el, { mult: mAtk }));

      const mDef = calc.elementMult(el.id, id);
      if(mDef >= 1.2) weakToAttackers.push(Object.assign({}, el, { mult: mDef }));
      else if(mDef <= 0.8) resistsAttackers.push(Object.assign({}, el, { mult: mDef }));
    });
    strongAgainst.sort((a, b) => b.mult - a.mult);
    weakAttackAgainst.sort((a, b) => a.mult - b.mult);
    weakToAttackers.sort((a, b) => b.mult - a.mult);
    resistsAttackers.sort((a, b) => a.mult - b.mult);
    return {
      info: calc.elementInfo(id),
      strongAgainst: strongAgainst,
      weakAttackAgainst: weakAttackAgainst,
      weakToAttackers: weakToAttackers,
      resistsAttackers: resistsAttackers
    };
  };

  calc.sizeMult = function(weaponId, targetSize){
    const es = (SL.store.get() || {}).elementSystem || SL.DEFAULT_DATA.elementSystem || {};
    const sm = es.sizeMatrix || {};
    const w = weaponId || 'unarmed', sz = targetSize || 'medium';
    if(sm[w] && sm[w][sz] !== undefined) return Number(sm[w][sz]);
    return 1.0;
  };

  calc.skillElement = function(skillId, spec, P){
    if(spec && spec.element) return spec.element;
    const id = String(skillId || '');
    if(id === 'mgFireBolt' || id === 'swMagnum') return 'fire';
    if(id === 'mgFrostNova') return 'ice';
    if(id === 'mgThunderStorm') return 'lightning';
    if(id === 'mgSoulStrike') return 'holy';
    if(id === 'thEnvenom' || id === 'thVenomCoat') return 'poison';
    return (P && P.attackElement) || 'neutral';
  };

  /* ---------- สูตรกลาง ---------- */
  calc.hitChance = function(hit, flee, lo, hi){
    const Gl = G();
    return clamp(Gl.hitBase + (hit - flee) * Gl.hitPerPoint, lo === undefined ? 0.05 : lo, hi === undefined ? 0.95 : hi);
  };
  calc.reduction = function(def, cap){ def = Math.max(0, def); return Math.min(cap, def / (def + G().softDefK)); };

  // ดาเมจพื้นฐานของการตีธรรมดา = 100% ATK (กายภาพ)
  calc.BASIC = { kind: 'physical', terms: [{ stat: 'atk', mult: 1 }], noCrit: false, alwaysHit: false };

  // แยกส่วนประกอบของดาเมจ (ไม่สุ่ม) — ใช้ทั้งสำหรับตารางคาดการณ์และการทอยจริง (รวมตัวคูณธาตุ RO)
  calc.components = function(spec, lv, P, M){
    const Gl = G(), S = P.stats;
    let raw = 0; const parts = [];
    (spec.terms || []).forEach(t => { const m = val(t.mult, lv), sv = S[t.stat] || 0; raw += m * sv; parts.push({ stat: t.stat, mult: m, value: sv, out: m * sv }); });
    const atkElem = spec.element || (P && P.attackElement) || 'neutral';
    const defElem = (M && M.element) || 'neutral';
    const elemMult = calc.elementMult(atkElem, defElem);
    const taken = (1 + (M.damageTaken || 0)) * elemMult;
    let normal, crit, cc, hc, red, critRed;
    if(spec.kind === 'magic'){
      red = calc.reduction(M.mdef, Gl.maxMagicReduction);
      critRed = calc.reduction(M.mdef * (1 - clamp(S.mdefIgnore, 0, 1)), Gl.maxMagicReduction);
      normal = raw * (1 - red);
      crit = raw * (Gl.critMult + S.critDmg) * (1 - critRed);
      cc = spec.noCrit ? 0 : clamp(S.magicCrit / 100, 0, 1);
      hc = 1;                                   // เวทไม่มีพลาด
    } else {
      red = calc.reduction(M.def * (1 - clamp(S.defPen, 0, 1)), Gl.maxPhysReduction);
      critRed = 0;                              // คริกายภาพข้าม DEF
      normal = raw * (1 - red);
      crit = raw * Gl.critMult;
      cc = spec.noCrit ? 0 : clamp(S.physCrit / 100, 0, 1);
      hc = spec.alwaysHit ? 1 : calc.hitChance(S.hit, M.flee);
    }
    normal = Math.max(1, normal * taken); crit = Math.max(1, crit * taken);
    const expected = cc * crit + (1 - cc) * hc * normal;   // คริติคอลถือว่าโดนเสมอ
    return { raw: raw, parts: parts, red: red, critRed: critRed, normal: normal, crit: crit, critChance: cc, hitChance: hc, expected: expected, kind: spec.kind, elemMult: elemMult, atkElem: atkElem, defElem: defElem };
  };

  // ทอยจริง 1 ครั้ง (rng = ฟังก์ชันสุ่ม 0..1, variance = ความแปรปรวนของดาเมจ ±)
  calc.roll = function(spec, lv, P, M, rng, variance){
    const c = calc.components(spec, lv, P, M);
    const crit = rng() < c.critChance;
    if(!crit && rng() >= c.hitChance) return { miss: true, crit: false, dmg: 0, elemMult: c.elemMult };
    let d = crit ? c.crit : c.normal;
    d *= 1 + (rng() * 2 - 1) * (variance || 0);
    return { miss: false, crit: crit, dmg: Math.max(1, Math.round(d)), elemMult: c.elemMult, atkElem: c.atkElem };
  };

  // ผลของมอนสเตอร์ตีผู้เล่น 1 ครั้ง (รองรับเกราะธาตุ P.defenseElement ป้องกันธาตุมอนสเตอร์ M.element)
  calc.monsterStrike = function(P, M, rng){
    const Gl = G(), S = P.stats;
    const hc = calc.hitChance(M.hit, S.flee, Math.max(0.05, 1 - Gl.maxDodge), 0.95);
    const elemMult = calc.elementMult((M && M.element) || 'neutral', (P && P.defenseElement) || 'neutral');
    if(rng() >= hc) return { miss: true, dmg: 0, blocked: false, elemMult: elemMult };
    let d = M.atk * (1 - calc.reduction(S.def, Gl.maxPhysReduction)) * (1 - S.physReduction) * (1 + S.damageTaken) * elemMult;
    let blocked = false;
    if(P.hasShield && S.blockChance > 0 && rng() < S.blockChance){ blocked = true; d *= (1 - Gl.blockReduction); }
    return { miss: false, blocked: blocked, dmg: Math.max(1, Math.round(d)), elemMult: elemMult };
  };

  // ค่าคาดหวังของมอนสเตอร์ต่อวินาที (ไว้โชว์ในแผงสรุป)
  calc.monsterDps = function(P, M){
    const Gl = G(), S = P.stats;
    const hc = calc.hitChance(M.hit, S.flee, Math.max(0.05, 1 - Gl.maxDodge), 0.95);

  const FC = () => SL.store.get().formulaConfig || SL.DEFAULT_DATA.formulaConfig;
  calc.statCost = function(cur){ return Math.floor(Math.max(1, cur) / 10) + 1; };

    if(wp.stat2) atk += (eff[wp.stat2] || 0) * (wp.coeff2 || 0);

    const flee = C.fleeBase + eff.agi * C.fleePerAgi + eff.luk * C.fleePerLuk;
    const physCrit = C.critBase + eff.luk * C.critPerLuk + (wp.critBonusFlat || 0);
    const matk = eff.int * C.matkPerInt * (1 + (wp.matkPercent || 0));
    const maxHp = Math.round((eff.vit * C.hpPerVit + lv * C.hpPerLevel) * kc.hpCoef);
    const maxSp = Math.round((eff.int * C.spPerInt + lv * C.spPerLevel) * kc.spCoef);
    const tension = Math.min(0.25, Math.max(0, aspd - C.aspdBase) * 0.002);
    const def = (eff.vit * C.defPerVit + (hasShield ? sh.defFlat : 0)) * (1 - tension);

    const spRegen = +((C.spRegenBase || 1.0) + eff.int * (C.spRegenPerInt || 0.05)).toFixed(2);
    const mc = F.magicCrit || { chanceBase:0, lukScalar:0.45, mdefIgnoreBase:0.5, dexScalar:0.002, mdefIgnoreCap:0.7, critDmgBase:0.1, intScalar:0.0008, critDmgCap:0.25 };

    const mdefIgnore = +(Math.min(mc.mdefIgnoreCap, mc.mdefIgnoreBase + eff.dex * mc.dexScalar)).toFixed(3);
    const critDmg = +(Math.min(mc.critDmgCap, mc.critDmgBase + eff.int * mc.intScalar)).toFixed(3);

      str: raw.str || 1, agi: raw.agi || 1, vit: raw.vit || 1, int: raw.int || 1, dex: raw.dex || 1, luk: raw.luk || 1,
      atk: +atk.toFixed(1), matk: +matk.toFixed(1), hit: +hit.toFixed(1), aspd: +aspd.toFixed(1),

      defPen: +(wp.defPen || 0).toFixed(2), def: +def.toFixed(1), mdef: +mdef.toFixed(1), flee: +flee.toFixed(1),

  calc.nextBaseExp = function(lv){
    const L = Math.max(1, Number(lv) || 1);

  };
  calc.nextJobExp = function(lv){
    const L = Math.max(1, Number(lv) || 1);
    return Math.round(80 + L * L * 14);
  };

  SL.calc = calc;

/* ============================================================
   MODULE 05 — sim : ตัวจำลองการต่อสู้เฉพาะสกิล (ไม่มี DOM, ก้าวเวลาคงที่ 0.05 วิ, สุ่มแบบกำหนด seed ได้)
   - ผู้เล่น: ตีธรรมดา / ใช้สกิล (ใช้เวลาแทนการตี 1 ครั้ง) / toggle / trigger / บัฟ / ฮีล
   - มอนสเตอร์: ถูกตี / สวนกลับ (เปิดได้) / ตาย-เกิดใหม่ หรือเป้านิ่งอมตะ

(function(g){

    const G = () => SL.store.get().globals;

    let pst, mst, cd, queue, dirty, P, M, T, events;

    const newTotals = () => ({ dmg:0, hits:0, crits:0, miss:0, casts:0, spUsed:0, hpLost:0, healed:0, deaths:0, kills:0, aliveTime:0,
      basic:{ n:0, dmg:0, crits:0, miss:0 }, skills:{}, uptime:{} });

    /* ---------- เงื่อนไขการใช้สกิล (คืนข้อความเหตุผลถ้าใช้ไม่ได้ / '' ถ้าใช้ได้) ---------- */
    function why(skill){

      if(!lv) return 'ยังไม่ได้เรียน';
      if(!alive) return 'ตายอยู่';
      if(!R.isCastable(skill)) return 'ไม่ใช่สกิลที่กดใช้ได้';
      if(R.chain(state.classId).indexOf(skill.class) < 0) return 'ไม่ใช่สกิลของสายนี้';
      if(!R.weaponOk(skill, P.weapon, P.hasShield)) return skill.needShield ? 'ต้องสวมโล่ + อาวุธ 1 มือ' : 'อาวุธไม่ตรงเงื่อนไข';
      const u = C.usage(skill, lv);
      if((cd[skill.id] || 0) > 0) return 'คูลดาวน์ ' + cd[skill.id].toFixed(1) + ' วิ';

    function basicAttack(){

    }

    function doCast(skill){

    }
    function revive(){
      alive = true; pst = []; dirty = true; recompute(); hp = P.stats.maxHp; sp = P.stats.maxSp; act = 0.3;

      [pst, mst].forEach(list => { for(let i = list.length - 1; i >= 0; i--){ list[i].left -= H;
        if(list[i].left <= 0){ const s = skillOf(list[i].id); list.splice(i, 1); dirty = true; if(s) ev('off', s.name + ' หมดเวลา', { who:'player' }); } } });

      T.aliveTime += H;

      sync(){
        [pst, mst].forEach(list => { for(let i = list.length - 1; i >= 0; i--){
          const lv = state.learned[list[i].id] || 0; if(!skillOf(list[i].id) || lv <= 0) list.splice(i, 1); else list[i].lv = lv; } });
        queue = queue.filter(q => skillOf(q.id)); dirty = true; recompute();
      },
      // สั่งใช้สกิลด้วยมือ (เข้าคิว รอจังหวะถัดไป) / toggle กดสลับได้ทันที
      cast(id){
        const s = skillOf(id); if(!s) return;

        if(!queue.some(q => q.id === id) && queue.length < 5) queue.push({ id: id, until: t + 8 });
      },
      why(idOrSkill){ const s = typeof idOrSkill === 'string' ? skillOf(idOrSkill) : idOrSkill; return s ? why(s) : 'ไม่พบสกิล'; },
      drain(){ const e = events; events = []; return e; },
      view(){
        return { t: t, hp: hp, maxHp: P.stats.maxHp, sp: sp, maxSp: P.stats.maxSp, alive: alive, reviveLeft: reviveLeft,
          mhp: mhp, mMax: M.maxHp, mAlive: mAlive, respawnLeft: respawnLeft,
          pst: pst.map(x => ({ id: x.id, lv: x.lv, left: x.left, toggle: !!x.toggle })), mst: mst.map(x => ({ id: x.id, lv: x.lv, left: x.left })),
          cd: Object.assign({}, cd), queue: queue.map(q => q.id), P: P, M: M, act: act };

    return SL.store.get().builds.map(b => {

/* ============================================================
   MODULE 05b — net-codec : โปรโตคอลไบนารีความเร็วสูง (FlatBuffers-style Binary Wire Codec)
   ไม่มีการแตะ DOM (รันได้ทั้งใน Browser, WebWorker และ Node.js Server)
   โครงสร้างแพ็กเก็ตไบนารี (Little-Endian, Zero-GC DataView):
   Header (4 bytes):
     [0] magic   : uint8  (0xC7 = CatQuest×RO Binary Frame)
     [1] version : uint8  (0x01)
     [2] opcode  : uint8  (OP_*)
     [3] flags   : uint8  (bit0 = compressed/delta, bit1 = authoritative)

  const VERSION = 1;

  // รหัส Opcode มาตรฐานตรงกันทั้ง Client (JS), Gateway (Go) และ Simulation Server (Go)
  const OP = {
    PING:           0x01, // 12B : [hdr:4][clientTs:f64]
    PONG:           0x02, // 16B : [hdr:4][clientTs:f64][serverTick:u32]
    AUTH:           0x03, // [hdr:4][classIdx:u8][weaponIdx:u8][baseLv:u8][jobLv:u8][nameLen:u8][nameBytes...]
    MOVE:           0x10, // 22B : [hdr:4][seq:u32][x:f32][y:f32][vx:i16][vy:i16][facing:i8][anim:u8]
    ATTACK:         0x11, // 16B : [hdr:4][seq:u32][targetUid:u32][x:u16][y:u16]
    SKILL:          0x12, // 18B : [hdr:4][seq:u32][skillIdx:u16][lv:u8][pad:u8][targetUid:u32][x:u16][y:u16]
    ROLL:           0x13, // 16B : [hdr:4][seq:u32][x:u16][y:u16][dx:i16][dy:i16]
    WORLD_SNAPSHOT: 0x20, // [hdr:4][serverTick:u32][peerCount:u8][mobCount:u8][peers...][mobs...]
    DAMAGE_EVENT:   0x21, // 20B : [hdr:4][attackerUid:u32][targetUid:u32][dmg:u32][hpLeft:u32][flags:u8(bit0:crit,bit1:miss,bit2:magic,bit3:kill)]
    TELEGRAPH:      0x22, // 22B : [hdr:4][mobUid:u32][shape:u8][x:u16][y:u16][radius:u16][angleDeg:i16][castMs:u16][multPct:u16]
    CHAT:           0x30  // [hdr:4][channel:u8][senderLen:u8][sender...][msgLen:u16][msg...]

  const CLASS_CODES = ['novice', 'swordman', 'thief', 'archer', 'mage'];
  const WEAPON_CODES = ['unarmed', 'sword_1h', 'sword_2h', 'axe', 'mace', 'dagger', 'bow', 'staff'];
  const SHAPE_CODES = ['circle', 'cone', 'line'];

  const textEnc = typeof TextEncoder !== 'undefined' ? new TextEncoder() : null;
  const textDec = typeof TextDecoder !== 'undefined' ? new TextDecoder() : null;

  function encodeUTF8(str){
    str = String(str || '');
    if(textEnc) return textEnc.encode(str);
    const arr = [];
    for(let i = 0; i < str.length; i++){
      let c = str.charCodeAt(i);
      if(c < 0x80) arr.push(c);
      else if(c < 0x800) arr.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      else arr.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));

      else if((c & 0xe0) === 0xc0) out += String.fromCharCode(((c & 0x1f) << 6) | (bytes[i++] & 0x3f));

    VERSION: VERSION,

    ANIM_CODES: ANIM_CODES,
    CLASS_CODES: CLASS_CODES,
    WEAPON_CODES: WEAPON_CODES,
    SHAPE_CODES: SHAPE_CODES,

      packetsRecv: 0,
      binaryBytes: 0,
      jsonEquivBytes: 0,
      lastFrameBytes: 0,
      lastJsonBytes: 0

    resetStats(){
      this.stats.packetsSent = 0;
      this.stats.packetsRecv = 0;
      this.stats.binaryBytes = 0;
      this.stats.jsonEquivBytes = 0;
      this.stats.lastFrameBytes = 0;
      this.stats.lastJsonBytes = 0;

      this.stats.jsonEquivBytes += jLen;
      this.stats.lastFrameBytes = binLen;
      this.stats.lastJsonBytes = jLen;
    },

    savingsRatio(){
      if(!this.stats.jsonEquivBytes) return 0.85;

    encodePong(clientTs, serverTick){

      writeHeader(dv, OP.PONG, 1);
      dv.setFloat64(4, clientTs || 0, true);
      dv.setUint32(12, serverTick || 0, true);
      return buf;
    },

    encodeAuth(p){
      const nameBytes = encodeUTF8((p && p.name) || 'Hero').slice(0, 64);
      const buf = new ArrayBuffer(9 + nameBytes.byteLength), dv = new DataView(buf);
      writeHeader(dv, OP.AUTH, 0);
      dv.setUint8(4, Math.max(0, CLASS_CODES.indexOf(p.classId)));
      dv.setUint8(5, Math.max(0, WEAPON_CODES.indexOf(p.weaponId)));
      dv.setUint8(6, Math.min(255, Math.max(1, p.baseLv || 50)));
      dv.setUint8(7, Math.min(255, Math.max(1, p.jobLv || 50)));
      dv.setUint8(8, nameBytes.byteLength);
      new Uint8Array(buf, 9).set(nameBytes);

    },

    // MOVE ใช้เพียง 22 ไบต์ (เทียบกับ JSON ~155 ไบต์ ประหยัด 85.8%)
    encodeMove(m){
      const buf = new ArrayBuffer(22), dv = new DataView(buf);
      writeHeader(dv, OP.MOVE, 0);
      dv.setUint32(4, m.seq || 0, true);
      dv.setFloat32(8, m.x || 0, true);
      dv.setFloat32(12, m.y || 0, true);
      dv.setInt16(16, Math.round(m.vx || 0), true);
      dv.setInt16(18, Math.round(m.vy || 0), true);
      dv.setInt8(20, (m.facing || 1) >= 0 ? 1 : -1);
      dv.setUint8(21, Math.max(0, ANIM_CODES.indexOf(m.animState || 'idle')));

    },

    // ATTACK ใช้เพียง 16 ไบต์
    encodeAttack(a){

      writeHeader(dv, OP.ATTACK, 0);
      dv.setUint32(4, a.seq || 0, true);
      dv.setUint32(8, a.targetUid || 0, true);
      dv.setUint16(12, Math.max(0, Math.round(a.x || 0)), true);
      dv.setUint16(14, Math.max(0, Math.round(a.y || 0)), true);
      this.recordStats(16, { op: 'attack', seq: a.seq, targetUid: a.targetUid, x: a.x, y: a.y }, false);
      return buf;
    },

    // SKILL ใช้เพียง 18 ไบต์
    encodeSkill(s){

      writeHeader(dv, OP.SKILL, 0);
      dv.setUint32(4, s.seq || 0, true);
      dv.setUint16(8, s.skillIdx || 0, true);
      dv.setUint8(10, s.lv || 1);
      dv.setUint8(11, 0);
      dv.setUint32(12, s.targetUid || 0, true);
      dv.setUint16(16, Math.max(0, Math.round(s.x || 0)), true);

    encodeDamageEvent(ev){

      dv.setUint32(8, ev.targetUid || 0, true);

      dv.setUint32(16, Math.max(0, Math.round(ev.hpLeft || 0)), true);

      dv.setUint8(20, flags);

      const snap = (typeof snapOrTick === 'object' && snapOrTick !== null)
        ? snapOrTick
        : { tick: snapOrTick || 0, peers: peersArg || [], mobs: mobsArg || [] };
      const peers = (snap && snap.peers) || [];
      const mobs = (snap && snap.mobs) || [];
      const pCount = Math.min(255, peers.length);
      const mCount = Math.min(255, mobs.length);
      const totalBytes = 10 + pCount * 16 + mCount * 16;
      const buf = new ArrayBuffer(totalBytes), dv = new DataView(buf);
      writeHeader(dv, OP.WORLD_SNAPSHOT, 1);
      dv.setUint32(4, (snap && snap.tick) || 0, true);

      dv.setUint8(9, mCount);

        const p = peers[i];
        dv.setUint32(off, p.uid || 0, true);
        dv.setUint16(off + 4, Math.max(0, Math.round(p.x || 0)), true);
        dv.setUint16(off + 6, Math.max(0, Math.round(p.y || 0)), true);
        dv.setUint16(off + 8, Math.max(0, Math.round(p.hp || 0)), true);
        dv.setUint16(off + 10, Math.max(1, Math.round(p.maxHp || 1)), true);
        dv.setUint8(off + 12, Math.max(0, CLASS_CODES.indexOf(p.classId || 'novice')));
        dv.setUint8(off + 13, Math.max(0, WEAPON_CODES.indexOf(p.weaponId || 'unarmed')));
        dv.setInt8(off + 14, (p.facing || 1) >= 0 ? 1 : -1);
        dv.setUint8(off + 15, Math.max(0, ANIM_CODES.indexOf(p.animState || 'idle')));

        dv.setUint32(off, m.uid || 0, true);
        dv.setUint16(off + 4, Math.max(0, Math.round(m.x || 0)), true);
        dv.setUint16(off + 6, Math.max(0, Math.round(m.y || 0)), true);
        dv.setUint32(off + 8, Math.max(0, Math.round(m.hp || 0)), true);
        dv.setUint8(off + 12, m.alive ? 1 : 0);
        dv.setInt8(off + 13, (m.facing || -1) >= 0 ? 1 : -1);

      writeHeader(dv, OP.CHAT, 0);
      dv.setUint8(4, c.channel || 0);
      dv.setUint8(5, sBytes.byteLength);
      dv.setUint16(6, mBytes.byteLength, true);

      const op = dv.getUint8(2);
      const flags = dv.getUint8(3);

      if(op === OP.PING && ab.byteLength >= 12){
